services:
  - type: web
    name: localwheels-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm install --production=false
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
