services:
  - type: web
    name: localwheels-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm install --production=false
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
