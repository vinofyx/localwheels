services:
  - type: web
    name: localwheels-backend
    env: node
    plan: starter          # Use "starter" ($7/mo) minimum for always-on; free tier sleeps after 15min
    rootDir: .
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ── Core (required — server will refuse to start without these) ──────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      # MongoDB Atlas connection string
      # Format: mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/localwheels?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false

      # JWT signing secret — generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      # Comma-separated list of allowed frontend origins (no trailing slash)
      # e.g. https://localwheels.vercel.app,https://app.yourdomain.com
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Frontend URL (shown in API root landing page) ────────────────────────
      - key: FRONTEND_URL
        sync: false

      # ── Clerk Authentication ─────────────────────────────────────────────────
      # Required for Google / social sign-in (clerk-exchange endpoint)
      # Get from: https://dashboard.clerk.com → API Keys
      - key: CLERK_SECRET_KEY
        sync: false          # sk_live_...  — NEVER commit this value

      - key: CLERK_PUBLISHABLE_KEY
        sync: false          # pk_live_...

      # Comma-separated list of authorized frontend origins for Clerk token verification
      # Must match ALLOWED_ORIGINS exactly
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

      # ── Security ─────────────────────────────────────────────────────────────
      # Random token to gate GET /api/metrics (Prometheus scrape)
      # generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: METRICS_TOKEN
        sync: false

      # AES-256 key for voice transcript encryption
      # generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: VOICE_ENCRYPTION_KEY
        sync: false

      # ── AI ───────────────────────────────────────────────────────────────────
      # Anthropic Claude API key — degrades to rule-based fallback if unset
      # Get from: https://console.anthropic.com
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: AI_TIMEOUT_MS
        value: 30000

      # ── Redis (optional but strongly recommended) ────────────────────────────
      # Redis Cloud: https://app.redislabs.com/  — Free 30MB tier available
      # Format: redis://:password@host:port
      - key: REDIS_URL
        sync: false

      # ── WhatsApp Business API (optional) ─────────────────────────────────────
      # Get from: https://developers.facebook.com → WhatsApp Business API
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      # ── Seed configuration (only used if you run the seed script in prod) ───
      - key: SEED_COMPANY_NAME
        sync: false

      - key: SEED_ADMIN_USERNAME
        sync: false

      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false
