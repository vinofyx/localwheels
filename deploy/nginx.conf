# LocalWheels Enterprise v1.0 — Nginx Configuration
# Architecture: Single-domain — frontend SPA + API proxy on the same domain
#
# Place at: /etc/nginx/sites-available/localwheels
# Enable:   ln -s /etc/nginx/sites-available/localwheels /etc/nginx/sites-enabled/localwheels
#           nginx -t && systemctl reload nginx
#
# Domain: Replace yourdomain.com with your actual domain throughout this file.
#
# URL layout after deployment:
#   https://yourdomain.com/          → React SPA (dist/index.html)
#   https://yourdomain.com/api/*     → Node.js backend (localhost:5000)
#   https://yourdomain.com/uploads/* → Static uploads (localhost:5000)
#
# Why single-domain?
#   The production JS bundle uses the relative path '/api' as the API base URL.
#   For relative paths to reach the backend, the frontend and API must share the
#   same origin. A split-subdomain setup (app.domain / api.domain) would require
#   VITE_API_URL to be set to an absolute URL at build time — that approach is
#   error-prone and was the root cause of the empty branch-select bug.

# ── Upstream — Node.js backend on localhost ────────────────────────────────────
upstream localwheels_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # ACME challenge — required by Certbot for SSL issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://yourdomain.com$request_uri;
    }
}

# ── HTTPS — main application ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — managed by Certbot (run: certbot --nginx -d yourdomain.com -d www.yourdomain.com)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=(self)" always;

    # Logging
    access_log /var/log/nginx/localwheels-access.log;
    error_log  /var/log/nginx/localwheels-error.log warn;

    # Serve frontend static files from dist/
    root  /var/www/localwheels/dist;
    index index.html;

    # Body size limit (covers file uploads)
    client_max_body_size 10M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ── Auth routes — strict rate limit ───────────────────────────────────────
    location ~ ^/api/auth/(login|clerk-exchange) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass         http://localwheels_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── All other API routes ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://localwheels_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── File upload serving ────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://localwheels_api;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Hashed static assets — cache 1 year (Vite adds content hash) ──────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html — never cache (always serve latest SPA shell) ──────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── SPA fallback — all non-API, non-asset routes → index.html ─────────────
    # React Router handles client-side routing; Nginx must not 404 on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
