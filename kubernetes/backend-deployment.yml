apiVersion: apps/v1
kind: Deployment
metadata:
  name: localwheels-backend
  namespace: localwheels
spec:
  replicas: 2
  selector:
    matchLabels:
      app: localwheels-backend
  template:
    metadata:
      labels:
        app: localwheels-backend
    spec:
      containers:
        - name: backend
          image: localwheels/backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: localwheels-secrets
                  key: mongodb-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: localwheels-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: localwheels-backend
  namespace: localwheels
spec:
  selector:
    app: localwheels-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
