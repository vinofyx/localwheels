# LocalWheels — nginx config for VPS deployment
# ─────────────────────────────────────────────────────────────────────────────
# This is an EXAMPLE. Adapt paths, domain, and port to your server.
#
# Assumptions:
#   • Frontend dist lives at  /var/www/localwheels/dist
#   • Backend runs on         http://127.0.0.1:5000
#   • Domain                  localwheels.example.com
#   • SSL via Certbot (Let's Encrypt) — run: certbot --nginx -d localwheels.example.com
#
# Quick-start:
#   sudo cp docs/nginx.conf /etc/nginx/sites-available/localwheels
#   sudo ln -s /etc/nginx/sites-available/localwheels /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name localwheels.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localwheels.example.com;

    # ── SSL (Certbot fills these in automatically) ────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/localwheels.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localwheels.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    # Upload dist/ contents to /var/www/localwheels/dist after npm run build
    root /var/www/localwheels/dist;
    index index.html;

    location / {
        # SPA fallback: serve index.html for any route so React Router works
        # on page refresh and direct-link navigation.
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (filenames are content-hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    # With this block, VITE_API_URL does NOT need to be set — the frontend uses
    # the /api fallback and nginx proxies it to the backend.
    location /api {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Uploaded files proxy ──────────────────────────────────────────────────
    location /uploads {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
